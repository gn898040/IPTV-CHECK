name: Auto IPTV Check

on:
  schedule:
    - cron: '0 22 * * *'  # 每天自動執行
  workflow_dispatch:      # 允許手動觸發

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # --- 新增：安裝系統級 ffmpeg/ffprobe (供深度畫質檢測使用) ---
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # --- 修改：在原本的套件中補上 aiohttp ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests opencc-python-reimplemented aiohttp

      - name: Run IPTV Checker
        env:
          PYTHONUNBUFFERED: "1"   # 關鍵：強制 Python 即時輸出 Log，不卡畫面！
        run: python -u checker.py

      - name: Commit & Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.m3u
          git commit -m "Auto update Playlist.m3u" || exit 0
          git pull --rebase origin main  # 關鍵：Push 前先拉取遠端最新修改並合併！
          git push
